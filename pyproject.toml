[project]
name = "datacurate"
version = "0.1.0"
description = "Data beats size: curating noisy web image-caption data for a small VLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "pillow",
  "pyyaml",
  "python-dotenv",
  "requests",
  "huggingface_hub",
  "wandb",
  "boto3",
  "tqdm",
]

[project.optional-dependencies]
# GPU pod only (RunPod). vLLM pins its own torch build.
gpu = ["vllm>=0.11", "transformers>=4.57", "torch", "ray[data]", "peft", "accelerate", "pycocoevalcap"]
notebook = ["jupyterlab", "ipykernel"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datacurate"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
